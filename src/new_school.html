<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholar - Nouveau établissement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body
    class="bg-[#f0f2f5] font-sans antialiased text-gray-800 flex h-screen overflow-hidden"
  >
    <div
      id="sidebar-overlay"
      class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"
    ></div>

    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 z-50 w-64 bg-[#0D0E6D] text-white flex flex-col justify-between transition-transform duration-300 transform -translate-x-full md:translate-x-0 md:static shadow-xl overflow-hidden"
    >
      <div>
        <div class="h-32 flex items-center justify-center w-full pt-4">
          <img
            src="./assets/images/logo.png"
            alt="Logo"
            class="h-20 object-contain"
          />
        </div>
        <nav class="mt-2 pl-3 space-y-1 flex-1 flex flex-col justify-around">
          <a
            href="accueil.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-[#232363] hover:text-white transition"
            ><i class="fa-solid fa-table-cells-large text-lg"></i
            ><span>Accueil</span></a
          >
          <a
            href="etablissement.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-[#232363] hover:text-white transition"
            ><i class="fa-solid fa-building-columns text-lg"></i
            ><span>Etablissements</span></a
          >
          <a
            href="paiement.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-[#232363] hover:text-white transition"
            ><i class="fa-solid fa-credit-card text-lg"></i
            ><span>Paiement</span></a
          >
          <!-- Actif -->
          <a
            href="new_student.html"
            class="flex items-center space-x-3 pl-4 pr-3 py-3 rounded-xl text-indigo-200 hover:bg-[#232363] hover:text-white transition"
            ><i class="fa-solid fa-user-plus text-lg"></i
            ><span>Nouveau un élève</span></a
          >
          <a
            href="new_school.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-l-2xl bg-[#f0f2f5] text-[#18184A] font-semibold shadow-md transition relative -mr-px"
          >
            <i class="fa-solid fa-school text-lg"></i>
            <span>Nouveau établissement</span>
          </a>
          <a
            href="historique.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-[#232363] hover:text-white transition"
            ><i class="fa-solid fa-clock-rotate-left text-lg"></i
            ><span>Historique des paiements</span></a
          >
          <a
            href="my_account.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-[#232363] hover:text-white transition"
            ><i class="fa-solid fa-user-gear text-lg"></i
            ><span>Mon Compte</span></a
          >
          <a
            href="support.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-[#232363] hover:text-white transition"
            ><i class="fa-solid fa-headset text-lg"></i
            ><span>Support client</span></a
          >
          <a
            href="about.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-[#232363] hover:text-white transition"
            ><i class="fa-solid fa-circle-info text-lg"></i
            ><span>A propos</span></a
          >
          <a
            href="contact.html"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-[#232363] hover:text-white transition"
            ><i class="fa-solid fa-at text-lg"></i
            ><span>Contactez Nous</span></a
          >
        </nav>
      </div>
      <div class="p-4 border-t border-indigo-900/50">
        <a
          href="#"
          class="flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-300 hover:bg-red-600/20 hover:text-red-400 transition"
          ><i class="fa-solid fa-right-from-bracket text-lg"></i
          ><span>Déconnexion</span></a
        >
      </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
      <header
        class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm z-30"
      >
        <div class="flex items-center space-x-4">
          <button
            id="menu-btn"
            class="md:hidden text-gray-700 focus:outline-none"
          >
            <i class="fa-solid fa-bars text-2xl"></i>
          </button>
          <div class="flex items-center space-x-2 text-gray-800">
            <i class="fa-solid fa-school text-[#18184A] text-xl"></i>
            <h1 class="text-xl font-bold text-[#18184A]">
              Enregistrer un nouveau établissement
            </h1>
          </div>
        </div>
        <div class="hidden items-center relative w-96 lg:flex">
          <i
            class="fa-solid fa-magnifying-glass absolute left-4 text-indigo-900 text-lg"
          ></i>
          <input
            type="text"
            placeholder="Recherche"
            data-site-search
            class="w-full rounded-full border border-gray-300 bg-gray-50 py-2 pl-12 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#18184A]"
          />
        </div>
        <div class="flex items-center space-x-3">
          <span class="text-sm font-semibold text-gray-700">Charles</span>
          <div
            class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-[#18184A] border border-indigo-200 shadow-sm"
          >
            <i class="fa-solid fa-user text-lg"></i>
          </div>
        </div>
      </header>
      <div class="bg-white border-b border-gray-200 p-4 lg:hidden">
        <div class="relative flex items-center">
          <i
            class="fa-solid fa-magnifying-glass absolute left-4 text-indigo-900"
          ></i>
          <input
            type="text"
            placeholder="Recherche"
            data-site-search
            class="w-full rounded-full border border-gray-300 bg-gray-50 py-2 pl-12 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#18184A]"
          />
        </div>
      </div>

      <main class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 bg-[#f8f9fc]">
        <div
          class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 max-w-2xl mx-auto"
        >
          <h2 class="text-lg font-bold text-[#18184A] mb-4">
            Informations de l'établissement
          </h2>
          <form id="school-form" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Nom de l'établissement</label
                >
                <input
                  type="text"
                  id="school-name"
                  placeholder="Ex: Collège INTAC"
                  class="w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#18184A]"
                />
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Type d'établissement</label
              >
              <select
                id="school-type"
                class="w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#18184A]"
              >
                <option>Géneral Francophone</option>
                <option>Général Anglophone</option>
                <option>Général Bilingue</option>
                <option>Technique Francophone</option>
                <option>Technique Anglophone</option>
                <option>Technique Bilingue</option>
                <option>Général et Technique Francophone</option>
                <option>Général et Technique Anglophone</option>
                <option>Général et Technique Bilingue</option>
              </select>
            </div>
            <div class="space-y-4" x-data="classManager()">
              <!-- Label et Champ de saisie -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                  Liste des salles de classe
                </label>
                <div class="flex gap-2">
                  <input
                    type="text"
                    x-model="newClassName"
                    @keydown.enter.prevent="addClass"
                    placeholder="Ex: Terminale C, 6ème A..."
                    class="w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#18184A]"
                  />
                  <button
                    type="button"
                    @click="addClass"
                    class="bg-[#18184A] text-white px-4 py-3 rounded-xl text-sm font-medium hover:bg-opacity-90 transition whitespace-nowrap"
                  >
                    Ajouter une classe
                  </button>
                </div>
              </div>

              <!-- Conteneur de la liste temporaire -->
              <div>
                <template x-if="classes.length === 0">
                  <p class="text-xs text-gray-400 italic">
                    Aucune classe ajoutée pour le moment.
                  </p>
                </template>

                <ul class="space-y-2">
                  <template x-for="(cls, index) in classes" :key="index">
                    <li
                      class="flex items-center justify-between bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-sm"
                    >
                      <span
                        class="text-gray-800 font-medium"
                        x-text="cls"
                      ></span>
                      <button
                        type="button"
                        @click="removeClass(index)"
                        class="text-red-500 hover:text-red-700 text-xs font-semibold"
                      >
                        Supprimer
                      </button>
                    </li>
                  </template>
                </ul>
              </div>

              <!-- Champ caché pour envoyer l'ensemble des données lors de la soumission du formulaire global -->
              <input
                type="hidden"
                name="salles_de_classe"
                :value="JSON.stringify(classes)"
              />

              <!-- Bouton d'enregistrement global (optionnel selon votre formulaire) -->
              <div>
                <button
                  type="button"
                  @click="saveAll"
                  class="w-full bg-green-600 text-white rounded-xl p-3 text-sm font-semibold hover:bg-green-700 transition"
                  :disabled="classes.length === 0"
                  :class="{'opacity-55 cursor-not-allowed': classes.length === 0}"
                >
                  Enregistrer toutes les salles (<span
                    x-text="classes.length"
                  ></span
                  >)
                </button>
              </div>
            </div>

            <p
              id="school-message"
              class="hidden text-center text-sm font-medium"
            ></p>

            <button
              type="submit"
              class="w-full bg-[#0D0E6D] text-white py-3 rounded-xl font-semibold shadow-md hover:bg-indigo-900 transition"
            >
              Enregistrer l'établissement
            </button>
          </form>
        </div>
      </main>
    </div>

    <script src="./assets/js/aside.js"></script>
    <script src="./assets/js/new_school.js"></script>
    <script>
      // ===== Stockage partagé des établissements (localStorage) =====
      const SCHOOLS_KEY = "scholar_schools";
      function getSchools() {
        try {
          return JSON.parse(localStorage.getItem(SCHOOLS_KEY)) || [];
        } catch (e) {
          return [];
        }
      }
      window.__currentClasses = [];

      // Gestion de la liste temporaire des classes (Alpine.js)
      function classManager() {
        return {
          newClassName: "",
          classes: [],
          addClass() {
            const name = this.newClassName.trim();
            if (!name) return;
            if (
              this.classes.some((c) => c.toLowerCase() === name.toLowerCase())
            ) {
              alert("Cette classe existe déjà dans la liste.");
              return;
            }
            this.classes.push(name);
            this.newClassName = "";
            window.__currentClasses = this.classes;
          },
          removeClass(index) {
            this.classes.splice(index, 1);
            window.__currentClasses = this.classes;
          },
          saveAll() {
            document.getElementById("school-form").requestSubmit();
          },
        };
      }

      document
        .getElementById("school-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const msg = document.getElementById("school-message");
          const show = (text, ok) => {
            msg.textContent = text;
            msg.className =
              "text-center text-sm font-medium " +
              (ok ? "text-green-700" : "text-red-600");
          };
          const name = document.getElementById("school-name").value.trim();
          const type = document.getElementById("school-type").value;
          const classes = [...window.__currentClasses];

          if (!name)
            return show("Veuillez saisir le nom de l'établissement.", false);
          if (classes.length === 0)
            return show(
              "Veuillez ajouter au moins une salle de classe.",
              false,
            );

          const schools = getSchools();
          if (
            schools.some((s) => s.name.toLowerCase() === name.toLowerCase())
          ) {
            return show("Un établissement portant ce nom existe déjà.", false);
          }
          schools.push({ id: Date.now().toString(), name, type, classes });
          localStorage.setItem(SCHOOLS_KEY, JSON.stringify(schools));

          show(
            "Établissement « " +
              name +
              " » enregistré avec " +
              classes.length +
              " classe(s).",
            true,
          );
          document.getElementById("school-name").value = "";
          // Vider la liste des classes Alpine
          const comp = document.querySelector("[x-data='classManager()']");
          if (comp && window.Alpine) Alpine.$data(comp).classes = [];
          window.__currentClasses = [];
        });
    </script>

    <script src="./assets/js/search.js"></script>
  </body>
</html>

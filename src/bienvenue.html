<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Scholar welcome page</title>
    <link rel="stylesheet" href="./assets/css/output.css" />

  <body

    <section

            <a

      <div class="bg-white h-full w-full flex justify-around items-end">
        <img
          src="./assets/images/093ad545f796a7753dc2e29773a2813d2f7b0adc.png"

        />
        <img
          src="./assets/images/50c31e2ce8d896447a5e5361378a29c07dbcbd7c.png"

        />
        <img
          src="./assets/images/bc35f921c9229dc5f75966c910ea62638044e604.png"
